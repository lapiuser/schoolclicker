services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitva}
      POSTGRES_USER: ${POSTGRES_USER:-bitva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bitva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bitva}
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:?set a long random secret key}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ""
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CAPTCHA_SESSION_MINUTES: ${CAPTCHA_SESSION_MINUTES:-20}
      CLICK_LIMIT_PER_MINUTE: ${CLICK_LIMIT_PER_MINUTE:-800}
      CLICK_MAX_PER_REQUEST: ${CLICK_MAX_PER_REQUEST:-800}
      CLICK_BURST_LIMIT_5S: ${CLICK_BURST_LIMIT_5S:-800}
      IP_REQUEST_LIMIT_PER_MINUTE: ${IP_REQUEST_LIMIT_PER_MINUTE:-120}
      IP_DAILY_CLICK_LIMIT: ${IP_DAILY_CLICK_LIMIT:-24000}
      ACTOR_CLICK_LIMIT_PER_MINUTE: ${ACTOR_CLICK_LIMIT_PER_MINUTE:-800}
      ACTOR_BURST_LIMIT_5S: ${ACTOR_BURST_LIMIT_5S:-800}
      ACTIVE_USER_SECONDS: ${ACTIVE_USER_SECONDS:-60}
      EVENT_RETENTION_SECONDS: ${EVENT_RETENTION_SECONDS:-900}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-nfu93amonyunker}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set an admin password}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      DONATION_URL: ${DONATION_URL:-https://www.donationalerts.com/}
      AUTHOR_WORDS: ${AUTHOR_WORDS:-БИТВА ШКОЛ — независимый рейтинг учебных заведений России.}
      ABOUT_TEXT: ${ABOUT_TEXT:-БИТВА ШКОЛ — честный интерактивный рейтинг учебных заведений России.}
      STATS_REFRESH_SECONDS: ${STATS_REFRESH_SECONDS:-15}
    expose:
      - "8000"
    volumes:
      - ./data/uploads:/app/static/uploads/schools
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set your domain, e.g. bitvashkol.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
