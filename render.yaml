services:
  - type: web
    name: bitva-shkol
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bitva-shkol-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: HOST
        value: "0.0.0.0"
      - key: COOKIE_SECURE
        value: "true"
      - key: TURNSTILE_ENABLED
        value: "true"
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CLICK_LIMIT_PER_MINUTE
        value: "800"
      - key: CLICK_MAX_PER_REQUEST
        value: "800"
      - key: CLICK_BURST_LIMIT_5S
        value: "800"
      - key: IP_REQUEST_LIMIT_PER_MINUTE
        value: "120"
      - key: IP_DAILY_CLICK_LIMIT
        value: "24000"
      - key: ACTOR_CLICK_LIMIT_PER_MINUTE
        value: "800"
      - key: ACTOR_BURST_LIMIT_5S
        value: "800"
      - key: ADMIN_USERNAME
        value: "nfu93amonyunker"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DONATION_URL
        value: "https://www.donationalerts.com/"
      - key: STATS_REFRESH_SECONDS
        value: "3"

databases:
  - name: bitva-shkol-db
    plan: free
    region: frankfurt
    databaseName: bitva
    user: bitva
